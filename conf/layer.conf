# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-reto"
BBFILE_PATTERN_meta-reto = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-reto = "100"

LAYERDEPENDS_meta-reto = "core"
LAYERSERIES_COMPAT_meta-reto = "scarthgap"

# I prefer systemd over sysvinit. There is a poky-altcfg that does the same:
DISTRO = "poky-altcfg"

# This layer is for Beaglebone Black
MACHINE = "am335x-evm"
